# luxodd/game-build — reusable Unity web build with plugin attestation.
# DRAFT 2026-11-16, not yet published. Design: docs/design/plugin-attestation-design.md.
#
# A game repo calls this with one short workflow (examples/caller-unity.yml). In order it:
#   1. checks out the game and this repo at the exact commit the caller pinned;
#   2. installs the pinned official plugin over the project's copy, checking the package hash;
#   3. verifies every plugin file against the published hash list;
#   4. fails on editor build hooks that reference the plugin;
#   5. builds for the web with fixed settings (GameCI);
#   6. re-verifies the plugin files, hashes every build file, and attests the result.
# The attestation is made inside this reusable workflow, so its signer is luxodd/game-build.
#
# Builds on luxodd/global-ci PR #2 (unity-webgl-deploy.yml): same pinned actions, Library cache,
# runner input and job.workflow_sha pinning. Unlike that pipeline it never deploys: the signed
# artifact goes to a game's draft (LUXL-2710), and promotion is a human approval.
# `unity: local` skips Docker and runs the runner's own editor (a self-hosted builder); the
# plugin install, verify, hook scan, re-verify and signing steps are the same on both paths.

name: Luxodd Unity web build

on:
  workflow_call:
    inputs:
      project-path:
        description: Unity project folder inside the caller repo.
        type: string
        default: .
      plugin-version:
        description: Official Unity plugin version; must have a hash list in plugin-manifests/unity/.
        type: string
        default: 1.2.0
      graphics:
        description: One graphics target per build, webgl2 or webgpu (WebGPU needs Unity 6000.x).
        type: string
        default: webgl2
      runner:
        description: Runner label for the build job (ubuntu-latest, a Ubicloud label, or a self-hosted Unity builder).
        type: string
        default: ubuntu-latest
      unity:
        description: "gameci: build in GameCI's Unity Docker image (needs Docker and Unity licence secrets). local: run the runner's own installed editor, the exact version in ProjectVersion.txt, with the runner's own licence (self-hosted, no Docker)."
        type: string
        default: gameci
      signing:
        description: "github: GitHub artifact attestation (public repos, or Enterprise Cloud). cosign: Sigstore keyless (any plan; writes the repo name to a public log)."
        type: string
        default: github
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false
      UNITY_SERIAL:
        required: false
    outputs:
      predicate-sha256:
        description: sha256 of the signed build predicate.
        value: ${{ jobs.build.outputs.predicate-sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write       # attestation and keyless signing
      attestations: write   # GitHub artifact attestations
    outputs:
      predicate-sha256: ${{ steps.predicate.outputs.sha256 }}
    env:
      PROJECT: ${{ inputs.project-path }}
      PLUGIN_VERSION: ${{ inputs.plugin-version }}
      GRAPHICS: ${{ inputs.graphics }}
      LUXODD_BUILDER: ${{ inputs.unity }}
    steps:
      - name: Check inputs
        run: |
          case "${{ inputs.graphics }}" in webgl2|webgpu) ;; *) echo "::error::graphics must be webgl2 or webgpu"; exit 1;; esac
          case "${{ inputs.signing }}" in github|cosign) ;; *) echo "::error::signing must be github or cosign"; exit 1;; esac
          case "${{ inputs.unity }}" in gameci|local) ;; *) echo "::error::unity must be gameci or local"; exit 1;; esac
          case "$PLUGIN_VERSION" in *[!0-9.]*|"") echo "::error::plugin-version must look like 1.2.0"; exit 1;; esac

      # The Unity image and Library need more disk than a hosted runner has free. Hosted only:
      # on a self-hosted machine this would delete real files.
      - name: Free disk space
        if: inputs.runner == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out game
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: game
          lfs: true
          persist-credentials: false

      # Our own scripts at the exact commit the caller pinned, not at a movable branch.
      - name: Check out luxodd/game-build at the pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: game-build
          persist-credentials: false

      - name: Fetch the pinned official plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="game-build/plugin-manifests/unity/$PLUGIN_VERSION.json"
          test -f "$manifest" || { echo "::error::no published hash list for plugin $PLUGIN_VERSION"; exit 1; }
          gh release download "v$PLUGIN_VERSION" --repo luxodd/unity-plugin \
            --pattern '*.unitypackage' --output plugin.unitypackage
          echo "MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: Install the plugin over the project's copy
        run: python3 -I game-build/tools/install_plugin.py "game/$PROJECT" plugin.unitypackage "$MANIFEST"

      - name: Verify plugin files against the hash list
        run: python3 -I game-build/tools/verify_plugin.py "game/$PROJECT" "$MANIFEST" --report plugin-before.json

      - name: Scan for build hooks that reference the plugin
        run: python3 -I game-build/tools/scan_build_hooks.py "game/$PROJECT" --report hooks.json

      - name: Add the Luxodd build script
        run: |
          mkdir -p "game/$PROJECT/Assets/LuxoddBuild/Editor"
          cp game-build/unity-build/Editor/LuxoddWebGLBuild.cs "game/$PROJECT/Assets/LuxoddBuild/Editor/"

      # Hosted runners start empty; a self-hosted workspace keeps its Library between runs.
      - name: Cache Library
        if: inputs.unity == 'gameci'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: game/${{ inputs.project-path }}/Library
          key: Library-WebGL-${{ inputs.graphics }}-${{ hashFiles(format('game/{0}/Packages/manifest.json', inputs.project-path), format('game/{0}/Packages/packages-lock.json', inputs.project-path), format('game/{0}/ProjectSettings/ProjectVersion.txt', inputs.project-path)) }}
          restore-keys: |
            Library-WebGL-${{ inputs.graphics }}-

      # Both build paths run the same build method with the same arguments; everything before
      # and after them (install, verify, hook scan, re-verify, predicate, signing) is shared.
      - name: Build (GameCI)
        if: inputs.unity == 'gameci'
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: game/${{ inputs.project-path }}
          unityVersion: auto          # the project's ProjectVersion.txt; never upgraded here
          targetPlatform: WebGL
          buildMethod: Luxodd.Build.LuxoddWebGLBuild.Build
          buildsPath: build
          versioning: None
          customParameters: -luxoddGraphics ${{ inputs.graphics }}

      - name: Take ownership of the build output
        if: inputs.unity == 'gameci'
        run: sudo chown -R "$USER" build

      - name: Build (local Unity)
        if: inputs.unity == 'local'
        run: |
          ver=$(sed -n 's/^m_EditorVersion: *//p' "game/$PROJECT/ProjectSettings/ProjectVersion.txt" | tr -d '\r')
          test -n "$ver" || { echo "::error::no m_EditorVersion in ProjectVersion.txt"; exit 1; }
          case "$RUNNER_OS" in
            macOS) unity="/Applications/Unity/Hub/Editor/$ver/Unity.app/Contents/MacOS/Unity" ;;
            Linux) unity="$HOME/Unity/Hub/Editor/$ver/Editor/Unity" ;;
            *) echo "::error::local Unity builds support macOS and Linux runners"; exit 1 ;;
          esac
          test -x "$unity" || { echo "::error::Unity $ver is not installed on this runner ($unity); never substituting another version"; exit 1; }
          mkdir -p build/WebGL
          status=0
          "$unity" -batchmode -nographics -quit \
            -projectPath "$PWD/game/$PROJECT" -buildTarget WebGL \
            -executeMethod Luxodd.Build.LuxoddWebGLBuild.Build \
            -customBuildPath "$PWD/build/WebGL" -luxoddGraphics "$GRAPHICS" \
            -logFile "$PWD/unity-build.log" || status=$?
          grep -E '\[LuxoddWebGLBuild\]|error CS[0-9]+' unity-build.log | tail -50 || true
          exit $status

      - name: Re-verify plugin files after the build
        run: python3 -I game-build/tools/verify_plugin.py "game/$PROJECT" "$MANIFEST" --report plugin-after.json

      - name: Write the build predicate
        id: predicate
        env:
          LUXODD_GAME_BUILD_SHA: ${{ job.workflow_sha }}
        run: |
          out=$(find build -name luxodd-build-settings.json -print -quit | xargs dirname)
          test -n "$out" || { echo "::error::build output not found"; exit 1; }
          python3 -I game-build/tools/build_manifest.py "$out" "$MANIFEST" plugin-after.json hooks.json luxodd-build.json
          echo "sha256=$(python3 -I -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' luxodd-build.json)" >> "$GITHUB_OUTPUT"
          echo "BUILD_DIR=$out" >> "$GITHUB_ENV"

      - name: Attest (GitHub)
        if: inputs.signing == 'github'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.BUILD_DIR }}/**
            luxodd-build.json

      - name: Install cosign
        if: inputs.signing == 'cosign'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Attest (cosign keyless)
        if: inputs.signing == 'cosign'
        run: |
          cosign sign-blob --yes --bundle luxodd-build.sigstore.json luxodd-build.json

      - name: Upload build and attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luxodd-webgl-build
          path: |
            ${{ env.BUILD_DIR }}
            luxodd-build.json
            luxodd-build.sigstore.json
            plugin-before.json
            plugin-after.json
            hooks.json
            unity-build.log
          if-no-files-found: warn
